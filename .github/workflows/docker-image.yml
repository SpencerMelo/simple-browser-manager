name: Docker Image CI

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # ghcr.io requires fully lowercase paths; github.repository_owner preserves
  # case, so we hardcode the lowercase form here.
  IMAGE_OWNER: spencermelo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        package: [chromium, firefox]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./packages/${{ matrix.package }}
          file: ./packages/${{ matrix.package }}/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/simple-browser-manager-${{ matrix.package }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max